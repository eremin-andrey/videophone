<script>
(function () {
  "use strict";
  var enc = new TextEncoder();
  var fails = 0;
  var $ = function (id) { return document.getElementById(id); };

  function b64(s) {
    var a = atob(s), u = new Uint8Array(a.length);
    for (var i = 0; i < a.length; i++) u[i] = a.charCodeAt(i);
    return u;
  }

  async function unlock(word) {
    var d = JSON.parse($("blob").textContent);
    var base = await crypto.subtle.importKey("raw", enc.encode(word.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: b64(d.s), iterations: d.i },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(d.n) }, key, b64(d.c));
    var txt = new TextDecoder().decode(plain);
    var cut = txt.indexOf("\n");
    return { room: txt.slice(5, cut), html: txt.slice(cut + 1) };
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  $("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var word = $("k").value;
    if (!word) return;
    if (!window.crypto || !crypto.subtle) {
      $("m").textContent = "Нужен https:// (браузер не даёт доступ к шифрованию).";
      return;
    }
    $("b").disabled = true;
    $("m").textContent = "";
    var r = null;
    try { r = await unlock(word); } catch (err) { r = null; }
    if (!r) {
      fails++;
      $("m").textContent = "Неверное слово";
      await sleep(Math.min(fails * 1000, 8000));
      $("b").disabled = false;
      $("k").select();
      return;
    }
    $("k").value = "";
    window.__ROOM = r.room;
    document.open();
    document.write(r.html);
    document.close();
  });
})();
</script>
